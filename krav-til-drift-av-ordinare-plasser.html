<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Krav til ordinære plasser</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #24342f; background: #f6f8f6; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    a { color: #176c59; }
    a:hover { color: #0c4d3e; }
    .bar { background: #123e34; color: white; padding: 18px max(24px, calc((100vw - 1280px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border: 0 !important; padding: 0 !important; }
    .bar a { color: white; font-size: 14px; text-decoration: none; border-bottom: 1px solid #9ac8ba; padding-bottom: 2px; }
    .layout { max-width: 1280px; margin: 0 auto; padding: 42px 24px 96px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 52px; align-items: start; }
    .contents { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; padding: 22px 16px 24px 0; border-right: 1px solid #d7e1dc; }
    .contents strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #62736c; margin-bottom: 16px; }
    .contents a { display: block; padding: 7px 10px; margin-left: -10px; border-radius: 6px; color: #38554a; text-decoration: none; font-size: 14px; line-height: 1.35; }
    .contents a:hover, .contents a:focus-visible { background: #e4eee9; color: #123e34; }
    .contents a.sub { padding-left: 24px; font-size: 13px; }
    .document { min-width: 0; background: white; border: 1px solid #dce5df; border-radius: 14px; box-shadow: 0 12px 35px rgba(26, 62, 48, .05); padding: clamp(28px, 5vw, 74px); }
    .document h1, .document h2, .document h3, .document h4 { color: #153f34; line-height: 1.2; scroll-margin-top: 28px; }
    .document h1 { font-size: clamp(32px, 4vw, 46px); letter-spacing: -.035em; max-width: 18ch; margin: 0 0 22px; }
    .document h2 { font-size: 28px; letter-spacing: -.025em; margin: 72px 0 20px; padding-top: 24px; border-top: 1px solid #dce5df; }
    .document h3 { font-size: 22px; margin: 42px 0 16px; }
    .document h4 { font-size: 18px; margin: 32px 0 14px; }
    .document p, .document li { font-size: 16px; line-height: 1.7; }
    .document p { margin: 0 0 18px; }
    .document h1 + p { color: #5b6e64; font-size: 15px; }
    .document ul, .document ol { padding-left: 26px; margin: 12px 0 24px; }
    .document li { padding-left: 5px; margin-bottom: 9px; }
    .document li::marker { color: #438a70; }
    .document li ul, .document li ol { margin: 10px 0; }
    .document strong { color: #164b3d; }
    .document sup { line-height: 0; }
    .document sup a { text-decoration: none; margin-left: 2px; }
    .footnotes { border-top: 1px solid #dce5df; margin-top: 18px; padding-top: 18px; }
    .footnotes li { font-size: 14px; line-height: 1.5; }
    #error { color: #9b2f27; }
    @media (max-width: 800px) {
      .layout { display: block; padding: 20px 14px 60px; }
      .contents { position: static; max-height: 180px; overflow: auto; padding: 12px 14px; margin-bottom: 18px; border: 1px solid #d7e1dc; border-radius: 10px; background: white; }
      .contents strong { margin-bottom: 5px; }
      .contents a { display: inline-block; margin: 0 6px 0 0; padding: 6px; }
      .contents a.sub { display: none; }
      .document { padding: 24px 20px 44px; }
      .document h2 { margin-top: 48px; }
    }
    @media print {
      :root { background: white; }
      .bar, .contents { display: none; }
      .layout { display: block; padding: 0; }
      .document { border: 0; box-shadow: none; padding: 0; }
      .document h2 { break-after: avoid; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="index.html">Dokumentarkiv</a>
    <a href="krav-til-drift-av-ordinare-plasser.pdf">Åpne original PDF ↗</a>
  </header>
  <div class="layout">
    <nav class="contents" aria-label="Innhold"><strong>Innhold</strong><div id="toc"></div></nav>
    <main id="document" class="document" aria-live="polite"><p>Laster dokumentet …</p></main>
  </div>
  <script src="vendor/marked.umd.js"></script>
  <script>
    const source = 'krav-til-drift-av-ordinare-plasser.md';
    const documentElement = document.getElementById('document');
    const toc = document.getElementById('toc');

    async function loadDocument() {
      const response = await fetch(source);
      if (!response.ok) throw new Error(`Kunne ikke åpne Markdown-filen (${response.status}).`);
      const markdown = await response.text();
      const notes = [...markdown.matchAll(/^\[\^(\d+)\]:\s*(.+)$/gm)];
      const body = markdown
        .replace(/^\[\^\d+\]:.*$/gm, '')
        .replace(/^## Fotnoter\s*$/m, '')
        .replace(/\[\^(\d+)\]/g, (_, number) => `<sup><a href="#footnote-${number}" aria-label="Fotnote ${number}">${number}</a></sup>`);
      documentElement.innerHTML = marked.parse(body);

      if (notes.length) {
        const section = document.createElement('section');
        section.className = 'footnotes';
        section.innerHTML = '<h2 id="fotnoter">Fotnoter</h2><ol></ol>';
        const list = section.querySelector('ol');
        for (const [, number, text] of notes) {
          const li = document.createElement('li');
          li.id = `footnote-${number}`;
          li.innerHTML = marked.parseInline(text);
          list.append(li);
        }
        documentElement.append(section);
      }

      for (const heading of documentElement.querySelectorAll('h2, h3')) {
        if (!heading.id) heading.id = heading.textContent.toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const link = document.createElement('a');
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent;
        if (heading.tagName === 'H3') link.className = 'sub';
        toc.append(link);
      }
    }

    loadDocument().catch(error => {
      documentElement.innerHTML = '<h1>Dokumentet kunne ikke lastes</h1><p id="error"></p><p>Åpne siden fra en lokal webserver, for eksempel <code>python -m http.server 8000</code>.</p>';
      document.getElementById('error').textContent = error.message;
    });
  </script>
</body>
</html>
